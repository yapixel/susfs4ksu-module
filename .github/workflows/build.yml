name: Build and Release

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout webui branch
        uses: actions/checkout@v4
        with:
          ref: webui

      - name: Get latest commit message
        id: commit_message
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%s)
          echo "message=$COMMIT_MSG" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build webui branch
        run: |
          npm ci || npm install
          npm run build

      - name: Copy dist folder to a temporary location
        run: |
          cp -r dist/ ../dist-temp/

      - name: Checkout v1.5.2+ branch
        uses: actions/checkout@v4
        with:
          ref: v1.5.2+

      - name: Remove old contents from webroot folder
        run: |
          rm -rf webroot/*

      - name: Copy contents from dist-temp to webroot
        run: |
          cp -r ../dist-temp/* webroot/

      - name: Commit & Push changes
        uses: actions-js/push@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          author_email: "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          author_name: "${{ github.actor }}"
          message: "WebUI: ${{ steps.commit_message.outputs.message }}"
          branch: 'v1.5.2+'
