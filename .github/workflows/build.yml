name: Build and Release

on:
  push:
    branches:
      - 'v1.5.2+'
    paths-ignore:
      - 'README.md'
      - '*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update version with git HEAD
        run: |
          RANDOM_STRING=$(git rev-parse --short HEAD | cut -c1-7)
          echo "BUILD_ID=${RANDOM_STRING}" >> $GITHUB_ENV
          if [ "${{ github.ref_type }}" != "tag" ]; then
            sed -i "s/version=v1.5.2-R.*/version=v1.5.2-CI-${RANDOM_STRING}/" module.prop
          fi

      - name: Package flashable zip
        run: |
          zip -r "ksu_module_susfs_1.5.2+_${{ env.BUILD_ID }}.zip" . \
            -x "*.git*" \
            -x "*.github*" \
            -x "*node_modules*" \
            -x "*src*" \
            -x "*tests*" \
            -x "README.md" \
            -x "LICENSE"
          cp "ksu_module_susfs_1.5.2+_${{ env.BUILD_ID }}.zip" "ksu_module_susfs_1.5.2+.zip"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-1.5.2+_${{ env.BUILD_ID }}
          path: ksu_module_susfs_1.5.2+_${{ env.BUILD_ID }}.zip

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ksu_module_susfs_1.5.2+_${{ env.BUILD_ID }}.zip
            ksu_module_susfs_1.5.2+.zip
